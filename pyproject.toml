[project]
name = "wattwisely"
authors = [
    { name = "Wattwisely", email = "admin@wattwisely.example" }
]
description = "Wattwisely ERP: project-supply workflows on Frappe and ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
